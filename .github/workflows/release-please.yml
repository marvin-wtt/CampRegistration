name: Release Please

# Keeps a release PR open that bumps the version from Conventional Commits on
# main. Merging it tags vX.Y.Z and publishes a GitHub Release; the tag push
# then triggers build-image.yml (production image + deploy). Claude then
# rewrites the release notes from the pull requests in the release.
#
# release-please authenticates as a GitHub App (vars.RELEASE_APP_CLIENT_ID,
# secrets.RELEASE_APP_PRIVATE_KEY): PRs and tags created with GITHUB_TOKEN
# don't trigger other workflows, so the tag would never build an image.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-notes:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect pull requests
        id: range
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | { grep -vx "$TAG" || true; } | head -n1)
          base=${prev:-$(jq -r '."bootstrap-sha"' release-please-config.json)}
          # Merge commits ("Merge pull request #12") and squash commits ("… (#12)")
          prs=$(git log --first-parent --format='%s' "$base..$TAG" \
            | { grep -oE '(^Merge pull request #[0-9]+|\(#[0-9]+\)$)' || true; } \
            | grep -oE '[0-9]+' | sort -un | paste -sd' ' - || true)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            RELEASE: ${{ env.TAG }}
            PREVIOUS RELEASE: ${{ steps.range.outputs.base }}
            PULL REQUESTS: ${{ steps.range.outputs.prs }}

            Write the release notes for RELEASE of CampRegistration, an event
            registration app (camps, seminars, workshops) for event organizers.

            Read each pull request with `gh pr view <n> --json title,body,labels,files`.
            Use `git log PREVIOUS..RELEASE --first-parent` to catch commits pushed
            to main without a pull request. Look at diffs only where a title and
            description leave the user-facing effect unclear.

            Write Markdown to `release-notes.md` in the working directory:
            - Sections, omitting empty ones: "⚠️ Breaking changes", "✨ Features",
              "🐛 Fixes", "🔧 Maintenance" (dependencies, CI, refactors — one short
              list, no detail).
            - One bullet per user-visible change, in plain language for event
              organizers, not developers. Merge related PRs into one bullet.
            - End each bullet with the PR reference(s), e.g. (#123).
            - Breaking changes must say what operators or users have to do.
            - No heading with the version and no intro or closing text.

            Leave out:
            - Fixes for bugs introduced within this release; they never shipped.
              Describe the feature in its final state instead.
            - Changes reverted within this release.
            - Test-only, docs-only and formatting changes.
            - Release PRs (chore(main): release …) and merge commits.

            Only write the file. Don't create comments, edit releases or push.
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Read,Write"

      - name: Update GitHub Release
        run: |
          test -s release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md

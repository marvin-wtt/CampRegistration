name: Release Please

# Keeps a "chore: release X.Y.Z" PR open that accumulates the changelog from
# Conventional Commits on main. Merging it tags vX.Y.Z and publishes a GitHub
# Release; the tag push then triggers build-image.yml (production image).
#
# Requires the RELEASE_PLEASE_TOKEN secret (fine-grained PAT or GitHub App
# token with contents + pull-requests + issues: read/write). The default
# GITHUB_TOKEN would work for the API calls, but events it causes don't start
# other workflows: the release PR would never get the required CI checks and
# the tag would never build an image.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

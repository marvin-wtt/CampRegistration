name: Release Please

# Keeps a release PR open that bumps the version from Conventional Commits on
# main. Merging it tags vX.Y.Z and publishes a GitHub Release; the tag push
# then triggers build-image.yml (production image + deploy) and the published
# release triggers release-notes.yml.
#
# release-please authenticates as a GitHub App (vars.RELEASE_APP_CLIENT_ID,
# secrets.RELEASE_APP_PRIVATE_KEY): PRs, tags and releases created with
# GITHUB_TOKEN don't trigger other workflows.

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

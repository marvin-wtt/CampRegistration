name: "app_dev"

services:
  db:
    image: postgres:18-alpine
    profiles: ["_base"]
    environment:
      POSTGRES_DB: database
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "user", "-d", "database"]
      interval: 5s
      timeout: 3s
      retries: 30

  # DEV DB
  pg_dev:
    extends:
      service: db
    profiles: ["dev"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  # TEST DB
  pg_test:
    extends:
      service: db
    profiles: ["test"]
    ports:
      - "127.0.0.1:5433:5432"

  # Redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # MailDev
  maildev:
    image: maildev/maildev:2.2.1
    profiles: ["dev", "test"]
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:1025:1025"

volumes:
  postgres_data:
    driver: local
